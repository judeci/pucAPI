<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- the main page to enter a CID -->
    <div class="container">
      <div class="form-div">
        <label for="idnum" class="form-label">Enter Civil ID:</label><br />
        <input id="idnum" name="idnum" class="form-id" /><br />
        <button type="submit" id="search-btn">
          <ion-icon
            class="btn-icon"
            name="caret-forward-circle-outline"
          ></ion-icon>
        </button>
      </div>
      <!-- error msg: -->
      <div class="hidden" id="student-output-msg"></div>
    </div>

    <!-- the result div that appears after searching for a CID -->
    <div class="hidden" id="hidden-container">
      <!-- <div class="hidden" id="student-output"></div> -->
      <div class="hidden" id="student-output2"></div>
    </div>

    <script src="script.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
